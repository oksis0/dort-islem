<!DOCTYPE html>
<html>
<body>
    <h2>Canlı Sonuç Ekranı</h2>
    <h1 id="cikti">Bekleniyor...</h1>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDsSTBA5D5-9WIlOjooJlpeYPsZla1sP7o",
            databaseURL: "https://dort-islem-c78ec-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "dort-islem-c78ec",
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Veritabanını 'dinle' (on value)
        db.ref('islem_sonucu').on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('cikti').innerText = data.hesaplanan;
            }
        });
    </script>
</body>
</html>
